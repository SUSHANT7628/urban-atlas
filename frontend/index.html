<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Urban Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2317233b'/%3E%3Cpath d='M16 5l4 8 8 3-8 3-4 8-4-8-8-3 8-3z' fill='%2386b6ef'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Cities">
    <a class="brand" href="#/overview">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15" class="brand-disc"/><path d="M16 5l4 8 8 3-8 3-4 8-4-8-8-3 8-3z" class="brand-star"/></svg>
      <span><b>Urban Atlas</b><small id="brandSub">City assessment</small></span>
    </a>
    <div class="rail-head"><span>Cities by overall score</span></div>
    <nav class="city-list" id="cityList"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <nav class="views" id="views" aria-label="Views">
        <a href="#/overview" data-v="overview">Overview</a>
        <a href="#/compare" data-v="compare">Compare</a>
        <a href="#/indicators" data-v="indicators">Indicators</a>
        <a href="#/readiness" data-v="readiness">Readiness</a>
        <a href="#/data" data-v="data">Data &amp; updates</a>
      </nav>
      <div class="top-right">
        <span class="sync" id="sync" role="status"></span>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch light or dark theme" title="Switch theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <main id="view" tabindex="-1"><div class="loading">Loading city data…</div></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="js/util.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
